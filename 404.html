<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman tidak ditemukan — AgriSuite</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { font-family: "Plus Jakarta Sans", sans-serif; }
  .agri-pattern { background-color: #f8faf9; background-image: radial-gradient(#278b4d12 1px, transparent 1px); background-size: 22px 22px; }
</style>
</head>
<body class="agri-pattern min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full text-center">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-[#1a482d] flex items-center justify-center shadow-lg">
      <i data-lucide="sprout" class="w-8 h-8 text-[#96deaf]"></i>
    </div>
    <p class="mt-6 text-[11px] font-extrabold tracking-widest uppercase text-[#278b4d]">Error 404</p>
    <h1 class="mt-2 text-2xl font-extrabold text-[#1a482d]">Halaman tidak ditemukan</h1>
    <p class="mt-2 text-sm text-slate-600">Tautan mungkin salah ketik atau modul sudah dipindahkan. Kembali ke beranda untuk memilih modul.</p>
    <a href="/" class="mt-6 inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#216e3f] hover:bg-[#1e5835] text-white text-sm font-bold transition">
      <i data-lucide="home" class="w-4 h-4"></i> Kembali ke beranda
    </a>
  </div>
  <script>if (window.lucide) window.lucide.createIcons();</script>
</body>
</html>
